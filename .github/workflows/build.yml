name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Core build check (desktop)
        run: make -C tools

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + CMake (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.POCKETPLUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/pocketplug.jks"
            echo "PP_KEYSTORE=$RUNNER_TEMP/pocketplug.jks" >> "$GITHUB_ENV"
          else
            echo "No POCKETPLUG_KEYSTORE_B64 secret: signing with the runner's debug key"
          fi

      - name: Build
        env:
          PP_KEYSTORE_PASSWORD: ${{ secrets.POCKETPLUG_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPlug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
